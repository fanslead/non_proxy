syntax = "proto3";

package nonproxy.common.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "NonProxy.Common.V1";

// Platform 表示组件或应用身份所属的操作系统。
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MACOS = 1;
  PLATFORM_WINDOWS = 2;
}

// TransportProtocol 表示连接使用的传输层协议。
enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_TCP = 1;
  TRANSPORT_PROTOCOL_UDP = 2;
}

// IpFamily 表示目标地址族。
enum IpFamily {
  IP_FAMILY_UNSPECIFIED = 0;
  IP_FAMILY_IPV4 = 1;
  IP_FAMILY_IPV6 = 2;
}

// RouteAction 表示策略要求的数据路径。
enum RouteAction {
  ROUTE_ACTION_UNSPECIFIED = 0;
  ROUTE_ACTION_DIRECT = 1;
  ROUTE_ACTION_PROXY = 2;
  ROUTE_ACTION_BLOCK = 3;
}

// FailureMode 表示目标数据路径不可用时的处理方式。
enum FailureMode {
  FAILURE_MODE_UNSPECIFIED = 0;
  FAILURE_MODE_CLOSED = 1;
  FAILURE_MODE_OPEN = 2;
}

// EvidenceLevel 表示连接结果已经获得的最高证据等级。
enum EvidenceLevel {
  EVIDENCE_LEVEL_UNSPECIFIED = 0;
  EVIDENCE_LEVEL_CONFIGURATION = 1;
  EVIDENCE_LEVEL_DECISION = 2;
  EVIDENCE_LEVEL_PATH = 3;
  EVIDENCE_LEVEL_EXIT = 4;
}

// Severity 表示结构化事件的严重等级。
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_DEBUG = 1;
  SEVERITY_INFO = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_ERROR = 4;
  SEVERITY_CRITICAL = 5;
}

// ComponentKind 表示参与本地控制协议的组件类型。
enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  COMPONENT_KIND_DESKTOP = 1;
  COMPONENT_KIND_GATEWAY = 2;
  COMPONENT_KIND_TRANSPARENT_PROXY = 3;
  COMPONENT_KIND_DNS_PROXY = 4;
  COMPONENT_KIND_NATIVE_MESSAGING_HOST = 5;
  COMPONENT_KIND_ADAPTER_HOST = 6;
  COMPONENT_KIND_WINDOWS_SERVICE = 7;
}

// AppIdentity 是跨平台稳定应用身份，不把 PID 或路径作为唯一身份。
message AppIdentity {
  Platform platform = 1;
  string stable_id = 2;
  string signer_id = 3;
  bytes executable_hash = 4;
  string executable_path_hint = 5;
  string display_name = 6;
  string parent_stable_id = 7;
  string helper_group_id = 8;
}

// Destination 描述连接的规范化目标。
message Destination {
  string hostname = 1;
  string normalized_domain = 2;
  string ip_address = 3;
  uint32 port = 4;
  TransportProtocol transport = 5;
  IpFamily ip_family = 6;
  string interface_name = 7;
}

// ErrorDetail 是跨进程稳定错误，不包含秘密或底层句柄。
message ErrorDetail {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> metadata = 4;
}

// ComponentVersion 用于握手和兼容性判断。
message ComponentVersion {
  ComponentKind component = 1;
  string semantic_version = 2;
  string build_id = 3;
  uint32 protocol_major = 4;
  uint32 protocol_minor = 5;
  uint32 minimum_protocol_minor = 6;
}

// PageRequest 描述有上限的分页请求。
message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

// PageResponse 描述下一页游标。
message PageResponse {
  string next_page_token = 1;
}

// TimeRange 描述闭区间查询范围。
message TimeRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}
