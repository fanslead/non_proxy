syntax = "proto3";

package nonproxy.control.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "nonproxy/common/v1/common.proto";
import "nonproxy/events/v1/events.proto";
import "nonproxy/policy/v1/policy.proto";

option csharp_namespace = "NonProxy.Control.V1";

// ControlService 是低权限控制客户端访问 gatewayd 的版本化接口。
service ControlService {
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GetActivePolicySnapshot(GetActivePolicySnapshotRequest) returns (GetActivePolicySnapshotResponse);
  rpc UpsertPolicy(UpsertPolicyRequest) returns (UpsertPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ApplyPolicySnapshot(ApplyPolicySnapshotRequest) returns (ApplyPolicySnapshotResponse);
  rpc RollbackPolicySnapshot(RollbackPolicySnapshotRequest) returns (RollbackPolicySnapshotResponse);
  rpc ListOutbounds(ListOutboundsRequest) returns (ListOutboundsResponse);
  rpc ListSubscriptionSources(ListSubscriptionSourcesRequest) returns (ListSubscriptionSourcesResponse);
  rpc UpsertSubscriptionSource(UpsertSubscriptionSourceRequest) returns (UpsertSubscriptionSourceResponse);
  rpc RefreshSubscriptionSource(RefreshSubscriptionSourceRequest) returns (RefreshSubscriptionSourceResponse);
  rpc DeleteSubscriptionSource(DeleteSubscriptionSourceRequest) returns (DeleteSubscriptionSourceResponse);
  rpc ListConnectionDecisions(ListConnectionDecisionsRequest) returns (ListConnectionDecisionsResponse);
  rpc ListExitProbes(ListExitProbesRequest) returns (ListExitProbesResponse);
  rpc ImportConfiguration(ImportConfigurationRequest) returns (ImportConfigurationResponse);
  rpc TestOutbound(TestOutboundRequest) returns (TestOutboundResponse);
  rpc VerifyExit(VerifyExitRequest) returns (VerifyExitResponse);
  rpc SetDefaultRoute(SetDefaultRouteRequest) returns (SetDefaultRouteResponse);
  rpc GetRuntimeOverrideStatus(GetRuntimeOverrideStatusRequest) returns (GetRuntimeOverrideStatusResponse);
  rpc SetRuntimeOverride(SetRuntimeOverrideRequest) returns (SetRuntimeOverrideResponse);
  rpc ClearRuntimeOverride(ClearRuntimeOverrideRequest) returns (ClearRuntimeOverrideResponse);
  rpc StartLearningSession(StartLearningSessionRequest) returns (StartLearningSessionResponse);
  rpc RecordLearningObservation(RecordLearningObservationRequest) returns (RecordLearningObservationResponse);
  rpc ListLearningCandidates(ListLearningCandidatesRequest) returns (ListLearningCandidatesResponse);
  rpc StopLearningSession(StopLearningSessionRequest) returns (StopLearningSessionResponse);
  rpc ConfirmLearningCandidates(ConfirmLearningCandidatesRequest) returns (ConfirmLearningCandidatesResponse);
  rpc ExportDiagnostics(ExportDiagnosticsRequest) returns (ExportDiagnosticsResponse);
  rpc ListNetworkProfiles(ListNetworkProfilesRequest) returns (ListNetworkProfilesResponse);
  rpc UpsertNetworkProfile(UpsertNetworkProfileRequest) returns (UpsertNetworkProfileResponse);
  rpc DeleteNetworkProfile(DeleteNetworkProfileRequest) returns (DeleteNetworkProfileResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SubscribeEventsResponse);
}

// CapabilityName 表示控制面可以安全展示的后端能力。
enum CapabilityName {
  CAPABILITY_NAME_UNSPECIFIED = 0;
  CAPABILITY_NAME_APP_MATCH = 1;
  CAPABILITY_NAME_DOMAIN_MATCH = 2;
  CAPABILITY_NAME_CIDR_MATCH = 3;
  CAPABILITY_NAME_TCP = 4;
  CAPABILITY_NAME_UDP = 5;
  CAPABILITY_NAME_IPV4 = 6;
  CAPABILITY_NAME_IPV6 = 7;
  CAPABILITY_NAME_DNS_SPLIT = 8;
  CAPABILITY_NAME_HOT_RELOAD = 9;
  CAPABILITY_NAME_PATH_EVIDENCE = 10;
  CAPABILITY_NAME_EXIT_PROBE = 11;
}

// OutboundKind 表示控制面支持的出站类型。
enum OutboundKind {
  OUTBOUND_KIND_UNSPECIFIED = 0;
  OUTBOUND_KIND_DIRECT = 1;
  OUTBOUND_KIND_HTTP_CONNECT = 2;
  OUTBOUND_KIND_SOCKS5 = 3;
  OUTBOUND_KIND_WIREGUARD = 4;
  OUTBOUND_KIND_OPENVPN = 5;
  OUTBOUND_KIND_EXTERNAL_ADAPTER = 6;
  OUTBOUND_KIND_SHADOWSOCKS = 7;
}

// DefaultRouteKind 表示未命中用户规则时采用的基础路由。
enum DefaultRouteKind {
  DEFAULT_ROUTE_KIND_UNSPECIFIED = 0;
  DEFAULT_ROUTE_KIND_DIRECT = 1;
  DEFAULT_ROUTE_KIND_PROXY = 2;
}

// ExitProbeRouteKind 表示要由独立远端探针验证的本地出站路径。
enum ExitProbeRouteKind {
  EXIT_PROBE_ROUTE_KIND_UNSPECIFIED = 0;
  EXIT_PROBE_ROUTE_KIND_DIRECT = 1;
  EXIT_PROBE_ROUTE_KIND_PROXY = 2;
}

// LearningSessionKind 表示学习会话的上下文。
enum LearningSessionKind {
  LEARNING_SESSION_KIND_UNSPECIFIED = 0;
  LEARNING_SESSION_KIND_APP = 1;
  LEARNING_SESSION_KIND_SITE = 2;
}

// LearningSessionState 表示学习会话是否仍可接收观测。
enum LearningSessionState {
  LEARNING_SESSION_STATE_UNSPECIFIED = 0;
  LEARNING_SESSION_STATE_ACTIVE = 1;
  LEARNING_SESSION_STATE_STOPPED = 2;
  LEARNING_SESSION_STATE_EXPIRED = 3;
}

// LearningObservationKind 表示浏览器上报的最小化网络事件类别。
enum LearningObservationKind {
  LEARNING_OBSERVATION_KIND_UNSPECIFIED = 0;
  LEARNING_OBSERVATION_KIND_MAIN_FRAME = 1;
  LEARNING_OBSERVATION_KIND_SUBRESOURCE = 2;
  LEARNING_OBSERVATION_KIND_REDIRECT = 3;
}

// LearningResourceType 表示不包含页面正文和 URL 路径的资源类别。
enum LearningResourceType {
  LEARNING_RESOURCE_TYPE_UNSPECIFIED = 0;
  LEARNING_RESOURCE_TYPE_MAIN_FRAME = 1;
  LEARNING_RESOURCE_TYPE_SUB_FRAME = 2;
  LEARNING_RESOURCE_TYPE_SCRIPT = 3;
  LEARNING_RESOURCE_TYPE_STYLE_SHEET = 4;
  LEARNING_RESOURCE_TYPE_IMAGE = 5;
  LEARNING_RESOURCE_TYPE_FONT = 6;
  LEARNING_RESOURCE_TYPE_MEDIA = 7;
  LEARNING_RESOURCE_TYPE_XML_HTTP_REQUEST = 8;
  LEARNING_RESOURCE_TYPE_FETCH = 9;
  LEARNING_RESOURCE_TYPE_WEB_SOCKET = 10;
  LEARNING_RESOURCE_TYPE_OTHER = 11;
}

// PolicyRuntimeState 表示当前草稿与已激活或待确认快照之间的关系。
enum PolicyRuntimeState {
  POLICY_RUNTIME_STATE_UNSPECIFIED = 0;
  POLICY_RUNTIME_STATE_DRAFT = 1;
  POLICY_RUNTIME_STATE_PENDING = 2;
  POLICY_RUNTIME_STATE_ACTIVE = 3;
  POLICY_RUNTIME_STATE_PENDING_REMOVAL = 4;
  POLICY_RUNTIME_STATE_REJECTED = 5;
}

// DiagnosticRedactionLevel 表示诊断包的脱敏强度。
enum DiagnosticRedactionLevel {
  DIAGNOSTIC_REDACTION_LEVEL_UNSPECIFIED = 0;
  DIAGNOSTIC_REDACTION_LEVEL_STANDARD = 1;
  DIAGNOSTIC_REDACTION_LEVEL_STRICT = 2;
}

// OperationContext 为高风险操作携带幂等键和短期授权能力。
message OperationContext {
  string operation_id = 1;
  bytes session_capability_token = 2;
}

// GetSystemStatusRequest 请求系统状态快照。
message GetSystemStatusRequest {}

// GetSystemStatusResponse 返回权威状态和最新事件游标。
message GetSystemStatusResponse {
  nonproxy.events.v1.RuntimeState state = 1;
  uint64 active_snapshot_version = 2;
  bool data_plane_enabled = 3;
  repeated ComponentStatus components = 4;
  uint64 latest_event_sequence = 5;
  nonproxy.common.v1.ErrorDetail error = 6;
  uint64 pending_snapshot_version = 7;
  DefaultRouteKind default_route = 8;
  string default_outbound_id = 9;
  uint64 routing_revision = 10;
  uint64 dropped_decision_events = 11;
}

// ComponentStatus 描述单个进程或 Provider 的状态。
message ComponentStatus {
  nonproxy.common.v1.ComponentKind component = 1;
  nonproxy.events.v1.RuntimeState state = 2;
  nonproxy.common.v1.ComponentVersion version = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  nonproxy.common.v1.ErrorDetail error = 5;
}

// GetCapabilitiesRequest 请求当前运行模式能力。
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse 返回后端声明的能力集合。
message GetCapabilitiesResponse {
  repeated CapabilityName capabilities = 1;
}

// ListPoliciesRequest 请求策略分页列表。
message ListPoliciesRequest {
  nonproxy.common.v1.PageRequest page = 1;
  bool include_disabled = 2;
}

// ListPoliciesResponse 返回策略和下一页游标。
message ListPoliciesResponse {
  repeated nonproxy.policy.v1.Policy policies = 1;
  nonproxy.common.v1.PageResponse page = 2;
  uint64 active_snapshot_version = 3;
  uint64 pending_snapshot_version = 4;
  repeated PolicyStatus policy_statuses = 5;
  uint64 policy_catalog_generation = 6;
  // previous_effective_snapshot_version 是当前 active 之前最近一次真正生效的快照。
  uint64 previous_effective_snapshot_version = 7;
}

// GetActivePolicySnapshotRequest 请求当前真正执行的不可变策略快照。
message GetActivePolicySnapshotRequest {}

// GetActivePolicySnapshotResponse 返回活动快照中的权威策略，而不是可能尚未发布的草稿。
// 第三方客户端适配器必须使用本响应生成规则，避免在 pending/rejected 状态下误删旧规则。
message GetActivePolicySnapshotResponse {
  uint64 snapshot_version = 1;
  bytes content_hash = 2;
  repeated nonproxy.policy.v1.Policy policies = 3;
  nonproxy.common.v1.ErrorDetail error = 4;
}

// PolicyStatus 保留规则草稿和仍在执行的旧修订之间的真实关系。
message PolicyStatus {
  nonproxy.policy.v1.Policy policy = 1;
  PolicyRuntimeState state = 2;
  uint64 target_snapshot_version = 3;
  uint64 effective_revision = 4;
  uint64 pending_revision = 5;
}

// ListNetworkProfilesRequest 请求隐私安全的网络配置档目录。
message ListNetworkProfilesRequest {
  nonproxy.common.v1.PageRequest page = 1;
}

// ListNetworkProfilesResponse 返回稳定排序的网络配置档草稿目录。
message ListNetworkProfilesResponse {
  repeated nonproxy.policy.v1.NetworkProfileSpec profiles = 1;
  nonproxy.common.v1.PageResponse page = 2;
  uint64 catalog_generation = 3;
}

// UpsertNetworkProfileRequest 使用乐观并发保存网络配置档。
message UpsertNetworkProfileRequest {
  OperationContext context = 1;
  nonproxy.policy.v1.NetworkProfileSpec profile = 2;
  uint64 expected_revision = 3;
}

// DeleteNetworkProfileRequest 删除未被策略引用的网络配置档。
message DeleteNetworkProfileRequest {
  OperationContext context = 1;
  string profile_id = 2;
  uint64 expected_revision = 3;
}

// NetworkProfileMutationResult 返回安全摘要或稳定错误码。
message NetworkProfileMutationResult {
  nonproxy.policy.v1.NetworkProfileSpec profile = 1;
  nonproxy.common.v1.ErrorDetail error = 2;
}

message UpsertNetworkProfileResponse {
  NetworkProfileMutationResult result = 1;
}

message DeleteNetworkProfileResponse {
  NetworkProfileMutationResult result = 1;
}

// UpsertPolicyRequest 使用乐观并发写入策略草稿。
message UpsertPolicyRequest {
  OperationContext context = 1;
  nonproxy.policy.v1.Policy policy = 2;
  uint64 expected_revision = 3;
}

// DeletePolicyRequest 使用乐观并发删除策略。
message DeletePolicyRequest {
  OperationContext context = 1;
  string policy_id = 2;
  uint64 expected_revision = 3;
}

// ApplyPolicySnapshotRequest 请求编译并发布当前草稿。
message ApplyPolicySnapshotRequest {
  OperationContext context = 1;
}

// RollbackPolicySnapshotRequest 请求回滚到已知有效快照。
message RollbackPolicySnapshotRequest {
  OperationContext context = 1;
  uint64 target_snapshot_version = 2;
  // expected_active_snapshot_version 防止并发发布后回滚到过时的“上一个配置”。
  uint64 expected_active_snapshot_version = 3;
}

// PolicyMutationResult 汇总策略写入和快照发布结果。
message PolicyMutationResult {
  nonproxy.policy.v1.Policy policy = 1;
  nonproxy.policy.v1.PolicySnapshotMetadata snapshot = 2;
  repeated nonproxy.policy.v1.PolicyConflict conflicts = 3;
  nonproxy.common.v1.ErrorDetail error = 4;
}

// UpsertPolicyResponse 返回策略写入结果。
message UpsertPolicyResponse {
  PolicyMutationResult result = 1;
}

// DeletePolicyResponse 返回策略删除结果。
message DeletePolicyResponse {
  PolicyMutationResult result = 1;
}

// ApplyPolicySnapshotResponse 返回快照编译与发布结果。
message ApplyPolicySnapshotResponse {
  PolicyMutationResult result = 1;
}

// RollbackPolicySnapshotResponse 返回快照回滚结果。
message RollbackPolicySnapshotResponse {
  PolicyMutationResult result = 1;
}

// OutboundSummary 返回不含秘密的出站摘要。
message OutboundSummary {
  string id = 1;
  string display_name = 2;
  OutboundKind kind = 3;
  bool enabled = 4;
  nonproxy.events.v1.RuntimeState health = 5;
  repeated CapabilityName capabilities = 6;
  string endpoint_host = 7;
  uint32 endpoint_port = 8;
  google.protobuf.Timestamp last_checked_at = 9;
  google.protobuf.Duration latency = 10;
  bool is_default = 11;
}

// ListOutboundsRequest 请求出站列表。
message ListOutboundsRequest {
  nonproxy.common.v1.PageRequest page = 1;
}

// ListOutboundsResponse 返回出站摘要。
message ListOutboundsResponse {
  repeated OutboundSummary outbounds = 1;
  nonproxy.common.v1.PageResponse page = 2;
  uint64 routing_revision = 3;
}

// SubscriptionSourceSummary 返回不含订阅 URL、凭据引用和响应正文的安全摘要。
message SubscriptionSourceSummary {
  string id = 1;
  string display_name = 2;
  bool enabled = 3;
  google.protobuf.Duration refresh_interval = 4;
  uint64 revision = 5;
  uint64 content_generation = 6;
  uint32 consecutive_failures = 7;
  google.protobuf.Timestamp next_refresh_at = 8;
  google.protobuf.Timestamp last_attempted_at = 9;
  google.protobuf.Timestamp last_succeeded_at = 10;
  string last_error_code = 11;
  uint32 node_count = 12;
}

message ListSubscriptionSourcesRequest {
  nonproxy.common.v1.PageRequest page = 1;
}

message ListSubscriptionSourcesResponse {
  repeated SubscriptionSourceSummary sources = 1;
  nonproxy.common.v1.PageResponse page = 2;
}

// UpsertSubscriptionSourceRequest 的 endpoint_url 只允许 HTTPS，服务端不得记录或持久化明文。
// 创建或更换地址时必须提供；修改已有订阅的名称、启停或间隔时可留空，表示继续使用已保存的凭据。
message UpsertSubscriptionSourceRequest {
  OperationContext context = 1;
  string source_id = 2;
  string display_name = 3;
  bytes endpoint_url = 4;
  bool enabled = 5;
  google.protobuf.Duration refresh_interval = 6;
  uint64 expected_revision = 7;
}

message SubscriptionMutationResult {
  SubscriptionSourceSummary source = 1;
  bool content_unchanged = 2;
  repeated string warnings = 3;
  nonproxy.common.v1.ErrorDetail error = 4;
}

message UpsertSubscriptionSourceResponse {
  SubscriptionMutationResult result = 1;
}

message RefreshSubscriptionSourceRequest {
  OperationContext context = 1;
  string source_id = 2;
  uint64 expected_revision = 3;
}

message RefreshSubscriptionSourceResponse {
  SubscriptionMutationResult result = 1;
}

// DeleteSubscriptionSourceRequest 原子删除订阅源及未被引用的全部所属出口。
message DeleteSubscriptionSourceRequest {
  OperationContext context = 1;
  string source_id = 2;
  uint64 expected_revision = 3;
}

// DeleteSubscriptionSourceResponse 不返回任何已删除凭据引用。
message DeleteSubscriptionSourceResponse {
  string source_id = 1;
  uint32 removed_outbound_count = 2;
  repeated string warnings = 3;
  nonproxy.common.v1.ErrorDetail error = 4;
}

// ConnectionDecisionSummary 是不含 URL 路径、查询参数和秘密的连接活动证据。
message ConnectionDecisionSummary {
  uint64 sequence = 1;
  string event_id = 2;
  google.protobuf.Timestamp observed_at = 3;
  nonproxy.common.v1.Platform app_platform = 4;
  string app_stable_id = 5;
  string app_display_name = 6;
  string destination = 7;
  uint32 destination_port = 8;
  nonproxy.common.v1.TransportProtocol transport = 9;
  nonproxy.common.v1.RouteAction action = 10;
  nonproxy.common.v1.FailureMode failure_mode = 11;
  string matched_policy_id = 12;
  string matched_rule_id = 13;
  string reason_code = 14;
  nonproxy.common.v1.EvidenceLevel evidence_level = 15;
  string interface_name = 16;
  string outbound_id = 17;
  string exit_probe_id = 18;
  google.protobuf.Duration decision_latency = 19;
  string error_code = 20;
  uint64 snapshot_version = 21;
  string provider_id = 22;
  uint64 provider_generation = 23;
  bool fail_open_direct = 24;
  string app_signer_id = 25;
  string app_parent_stable_id = 26;
  string app_helper_group_id = 27;
}

// ListConnectionDecisionsRequest 查询最新的有界连接活动。
message ListConnectionDecisionsRequest {
  nonproxy.common.v1.PageRequest page = 1;
}

// ListConnectionDecisionsResponse 返回活动、分页游标和保留窗口内的总数。
message ListConnectionDecisionsResponse {
  repeated ConnectionDecisionSummary decisions = 1;
  nonproxy.common.v1.PageResponse page = 2;
  uint64 total_count = 3;
}

// ExitProbeSummary 是 gatewayd 已验签并持久化的路由级公网出口回执。
message ExitProbeSummary {
  uint64 sequence = 1;
  string probe_id = 2;
  ExitProbeRouteKind route = 3;
  string outbound_id = 4;
  string observed_ip = 5;
  nonproxy.common.v1.IpFamily ip_family = 6;
  google.protobuf.Timestamp observed_at = 7;
  string key_id = 8;
  google.protobuf.Timestamp verified_at = 9;
}

// ListExitProbesRequest 查询最新的有界签名出口回执。
message ListExitProbesRequest {
  nonproxy.common.v1.PageRequest page = 1;
}

// ListExitProbesResponse 明确区分“未配置能力”和“尚无验证结果”。
message ListExitProbesResponse {
  repeated ExitProbeSummary probes = 1;
  nonproxy.common.v1.PageResponse page = 2;
  uint64 total_count = 3;
  bool verification_available = 4;
}

// ImportConfigurationRequest 发送有大小上限且不得记录日志的配置内容。
message ImportConfigurationRequest {
  OperationContext context = 1;
  string format = 2;
  bytes configuration = 3;
  bool validate_only = 4;
}

// ImportConfigurationResponse 返回检测结果和不含秘密的出站摘要。
message ImportConfigurationResponse {
  string import_id = 1;
  repeated OutboundSummary outbounds = 2;
  repeated string warnings = 3;
  nonproxy.common.v1.ErrorDetail error = 4;
}

// TestOutboundRequest 发起不包含用户目标的健康检查。
message TestOutboundRequest {
  OperationContext context = 1;
  string outbound_id = 2;
  google.protobuf.Duration timeout = 3;
}

// TestOutboundResponse 返回出站健康检查结果。
message TestOutboundResponse {
  bool healthy = 1;
  google.protobuf.Duration latency = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
}

// VerifyExitRequest 只选择已知出站；探针地址和信任公钥由后台安装配置固定。
message VerifyExitRequest {
  OperationContext context = 1;
  ExitProbeRouteKind route = 2;
  string outbound_id = 3;
  google.protobuf.Duration timeout = 4;
}

// VerifyExitResponse 返回由后台验证过的签名回执摘要，不包含用户访问目标。
message VerifyExitResponse {
  bool verified = 1;
  string probe_id = 2;
  string observed_ip = 3;
  nonproxy.common.v1.IpFamily ip_family = 4;
  google.protobuf.Timestamp observed_at = 5;
  ExitProbeRouteKind route = 6;
  string outbound_id = 7;
  nonproxy.common.v1.ErrorDetail error = 8;
}

// SetDefaultRouteRequest 原子修改默认路由并生成新的待确认快照。
message SetDefaultRouteRequest {
  OperationContext context = 1;
  oneof route {
    bool direct = 2;
    string outbound_id = 3;
  }
  uint64 expected_routing_revision = 4;
}

// SetDefaultRouteResponse 返回持久化 revision 和待确认快照。
message SetDefaultRouteResponse {
  uint64 routing_revision = 1;
  nonproxy.policy.v1.PolicySnapshotMetadata snapshot = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
}

// GetRuntimeOverrideStatusRequest 请求当前及待确认的紧急运行态覆盖。
message GetRuntimeOverrideStatusRequest {}

// GetRuntimeOverrideStatusResponse 区分 Provider 已确认状态和新的待确认请求。
message GetRuntimeOverrideStatusResponse {
  nonproxy.policy.v1.RuntimeRoutingOverride active_override = 1;
  nonproxy.policy.v1.RuntimeRoutingOverride pending_override = 2;
  uint64 active_snapshot_version = 3;
  uint64 pending_snapshot_version = 4;
  bool pending_clears_override = 5;
}

// SetRuntimeOverrideRequest 创建有时限覆盖，不改变 routing_settings。
message SetRuntimeOverrideRequest {
  OperationContext context = 1;
  nonproxy.policy.v1.RuntimeOverrideMode mode = 2;
  google.protobuf.Duration duration = 3;
  string outbound_id = 4;
  uint64 expected_active_snapshot_version = 5;
}

message SetRuntimeOverrideResponse {
  PolicyMutationResult result = 1;
}

// ClearRuntimeOverrideRequest 用新快照显式取消尚未到期的覆盖。
message ClearRuntimeOverrideRequest {
  OperationContext context = 1;
  uint64 expected_active_snapshot_version = 2;
}

message ClearRuntimeOverrideResponse {
  PolicyMutationResult result = 1;
}

// StartLearningSessionRequest 启动有时限的学习会话。
message StartLearningSessionRequest {
  OperationContext context = 1;
  LearningSessionKind kind = 2;
  google.protobuf.Duration duration = 5;
  // browser_context_id 是扩展生成的随机标签页能力标识，不得使用浏览器真实 tab ID。
  string browser_context_id = 6;
  oneof subject {
    nonproxy.common.v1.AppIdentity app = 3;
    string normalized_site = 4;
  }
}

// StartLearningSessionResponse 返回会话身份和截止时间。
message StartLearningSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
}

// LearningSessionSummary 返回不包含路径、查询参数或页面正文的学习会话。
message LearningSessionSummary {
  string session_id = 1;
  LearningSessionKind kind = 2;
  LearningSessionState state = 3;
  string browser_context_id = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp stopped_at = 7;
  oneof subject {
    nonproxy.common.v1.AppIdentity app = 8;
    string normalized_site = 9;
  }
}

// LearningCandidate 是按域名聚合的学习结果，不包含原始 URL。
message LearningCandidate {
  string normalized_domain = 1;
  string registrable_domain = 2;
  nonproxy.events.v1.LearningCandidateKind kind = 3;
  float confidence = 4;
  bool requires_confirmation = 5;
  uint32 evidence_count = 6;
  google.protobuf.Timestamp first_seen_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  uint32 main_frame_count = 9;
  uint32 subresource_count = 10;
  uint32 redirect_count = 11;
}

// RecordLearningObservationRequest 仅接受域名和枚举化元数据。
message RecordLearningObservationRequest {
  OperationContext context = 1;
  string session_id = 2;
  string observation_id = 3;
  string browser_context_id = 4;
  LearningObservationKind kind = 5;
  string normalized_domain = 6;
  string initiator_domain = 7;
  LearningResourceType resource_type = 8;
}

// RecordLearningObservationResponse 返回更新后的聚合候选。
message RecordLearningObservationResponse {
  LearningCandidate candidate = 1;
  bool duplicate = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
}

// ListLearningCandidatesRequest 查询单个有界学习会话。
message ListLearningCandidatesRequest {
  OperationContext context = 1;
  string session_id = 2;
}

// ListLearningCandidatesResponse 返回会话和最多 256 个候选。
message ListLearningCandidatesResponse {
  LearningSessionSummary session = 1;
  repeated LearningCandidate candidates = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
}

// StopLearningSessionRequest 停止指定学习会话。
message StopLearningSessionRequest {
  OperationContext context = 1;
  string session_id = 2;
}

// StopLearningSessionResponse 返回最终候选数量。
message StopLearningSessionResponse {
  uint32 candidate_count = 1;
  nonproxy.common.v1.ErrorDetail error = 2;
  LearningSessionSummary session = 3;
}

// ConfirmLearningCandidatesRequest 将已结束站点会话中选中的域名原子写为直连规则。
message ConfirmLearningCandidatesRequest {
  OperationContext context = 1;
  string session_id = 2;
  // confirmation_id 是客户端生成的幂等键；相同键只能重放完全相同的选择。
  string confirmation_id = 3;
  repeated string selected_domains = 4;
}

// ConfirmedLearningPolicy 返回规范化域名与最终策略 ID 的稳定映射。
message ConfirmedLearningPolicy {
  string normalized_domain = 1;
  string policy_id = 2;
}

// ConfirmLearningCandidatesResponse 返回全量确认结果和待 Provider 确认的快照。
message ConfirmLearningCandidatesResponse {
  repeated ConfirmedLearningPolicy policies = 1;
  nonproxy.policy.v1.PolicySnapshotMetadata snapshot = 2;
  bool replayed = 3;
  repeated nonproxy.policy.v1.PolicyConflict conflicts = 4;
  nonproxy.common.v1.ErrorDetail error = 5;
}

// ExportDiagnosticsRequest 请求生成本地诊断包，不自动上传。
message ExportDiagnosticsRequest {
  OperationContext context = 1;
  DiagnosticRedactionLevel redaction_level = 2;
  nonproxy.common.v1.TimeRange time_range = 3;
}

// ExportDiagnosticsResponse 返回可供用户预览的本地文件引用。
message ExportDiagnosticsResponse {
  string diagnostic_id = 1;
  string local_path = 2;
  uint64 size_bytes = 3;
  bytes sha256 = 4;
  nonproxy.common.v1.ErrorDetail error = 5;
  DiagnosticRedactionLevel applied_redaction_level = 6;
  nonproxy.common.v1.TimeRange effective_time_range = 7;
  repeated string included_sections = 8;
  uint32 connection_sample_count = 9;
  uint32 error_count = 10;
}

// SubscribeEventsRequest 从给定游标开始订阅事件。
message SubscribeEventsRequest {
  uint64 after_sequence = 1;
  nonproxy.common.v1.Severity minimum_severity = 2;
}

// SubscribeEventsResponse 包装单个有序事件。
message SubscribeEventsResponse {
  nonproxy.events.v1.EventEnvelope event = 1;
}
