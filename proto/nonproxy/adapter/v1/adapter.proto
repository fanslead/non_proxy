syntax = "proto3";

package nonproxy.adapter.v1;

import "google/protobuf/timestamp.proto";
import "nonproxy/common/v1/common.proto";

option csharp_namespace = "NonProxy.Adapter.V1";

// AdapterService 隔离第三方客户端配置和重载操作。
service AdapterService {
  rpc RegisterInstallation(RegisterInstallationRequest) returns (RegisterInstallationResponse);
  rpc ListInstallations(ListInstallationsRequest) returns (ListInstallationsResponse);
  rpc RemoveInstallation(RemoveInstallationRequest) returns (RemoveInstallationResponse);
  rpc Detect(DetectRequest) returns (DetectResponse);
  rpc ReadCapabilities(ReadCapabilitiesRequest) returns (ReadCapabilitiesResponse);
  rpc PrepareChange(PrepareChangeRequest) returns (PrepareChangeResponse);
  rpc ApplyChange(ApplyChangeRequest) returns (ApplyChangeResponse);
  rpc VerifyChange(VerifyChangeRequest) returns (VerifyChangeResponse);
  rpc RollbackChange(RollbackChangeRequest) returns (RollbackChangeResponse);
}

// AdapterClient 表示由公开配置格式支持的第三方客户端。
enum AdapterClient {
  ADAPTER_CLIENT_UNSPECIFIED = 0;
  ADAPTER_CLIENT_SURGE = 1;
  ADAPTER_CLIENT_MIHOMO = 2;
  ADAPTER_CLIENT_SING_BOX = 3;
}

// AdapterCapability 表示第三方客户端可以准确提供的能力。
enum AdapterCapability {
  ADAPTER_CAPABILITY_UNSPECIFIED = 0;
  ADAPTER_CAPABILITY_APP_RULE = 1;
  ADAPTER_CAPABILITY_DOMAIN_RULE = 2;
  ADAPTER_CAPABILITY_DNS_SPLIT = 3;
  ADAPTER_CAPABILITY_HOT_RELOAD = 4;
  ADAPTER_CAPABILITY_PATH_EVIDENCE = 5;
  ADAPTER_CAPABILITY_EXIT_PROBE = 6;
  ADAPTER_CAPABILITY_CIDR_RULE = 7;
}

// AdapterState 表示第三方客户端当前状态。
enum AdapterState {
  ADAPTER_STATE_UNSPECIFIED = 0;
  ADAPTER_STATE_NOT_INSTALLED = 1;
  ADAPTER_STATE_UNSUPPORTED = 2;
  ADAPTER_STATE_AVAILABLE = 3;
  ADAPTER_STATE_APPLYING = 4;
  ADAPTER_STATE_READY = 5;
  ADAPTER_STATE_FAILED = 6;
}

// AdapterRequestContext 为每个本地请求携带幂等键和短期授权能力。
message AdapterRequestContext {
  string operation_id = 1;
  bytes session_capability_token = 2;
}

// AdapterInstallation 是用户明确登记的第三方客户端安装项。
message AdapterInstallation {
  string adapter_id = 1;
  AdapterClient client = 2;
  string client_name = 3;
  string client_version = 4;
  string executable_path = 5;
  string managed_rules_path = 6;
  AdapterState state = 7;
  string main_configuration_path = 8;
  // direct_target 为空时由适配器从主配置中唯一解析。
  string direct_target = 9;
}

// RegisterInstallationRequest 登记用户明确选择的客户端、主配置和托管 sidecar。
message RegisterInstallationRequest {
  AdapterRequestContext context = 1;
  string adapter_id = 2;
  AdapterClient client = 3;
  string executable_path = 4;
  string managed_rules_path = 5;
  string main_configuration_path = 6;
  // direct_target 仅在主配置存在多个直连出口时需要显式提供。
  string direct_target = 7;
}

// RegisterInstallationResponse 返回只含本机配置元数据的安装项。
message RegisterInstallationResponse {
  AdapterInstallation installation = 1;
  bool replayed = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
}

// ListInstallationsRequest 请求当前登记的有限安装项集合。
message ListInstallationsRequest {
  AdapterRequestContext context = 1;
}

// ListInstallationsResponse 返回稳定排序的安装项。
message ListInstallationsResponse {
  repeated AdapterInstallation installations = 1;
  nonproxy.common.v1.ErrorDetail error = 2;
}

// RemoveInstallationRequest 移除登记但不删除第三方配置或恢复材料。
message RemoveInstallationRequest {
  AdapterRequestContext context = 1;
  string adapter_id = 2;
}

// RemoveInstallationResponse 返回幂等移除结果。
message RemoveInstallationResponse {
  bool removed = 1;
  nonproxy.common.v1.ErrorDetail error = 2;
}

// DetectRequest 请求只读检测指定适配器。
message DetectRequest {
  string adapter_id = 1;
  AdapterRequestContext context = 2;
}

// DetectResponse 返回不含凭据的客户端身份。
message DetectResponse {
  AdapterState state = 1;
  string client_name = 2;
  string client_version = 3;
  string installation_id = 4;
  nonproxy.common.v1.ErrorDetail error = 5;
}

// ReadCapabilitiesRequest 请求适配器能力。
message ReadCapabilitiesRequest {
  string adapter_id = 1;
  string installation_id = 2;
  AdapterRequestContext context = 3;
}

// ReadCapabilitiesResponse 返回版本限定的能力。
message ReadCapabilitiesResponse {
  repeated AdapterCapability capabilities = 1;
  nonproxy.common.v1.ErrorDetail error = 2;
}

// PrepareChangeRequest 请求生成并验证候选配置。
message PrepareChangeRequest {
  // operation_id 是 v1 预留字段；新客户端必须使用 context.operation_id。
  string operation_id = 1;
  string adapter_id = 2;
  string installation_id = 3;
  bytes normalized_policy = 4;
  bytes normalized_policy_hash = 5;
  AdapterRequestContext context = 6;
}

// PrepareChangeResponse 返回候选配置和备份引用。
message PrepareChangeResponse {
  string change_id = 1;
  string backup_id = 2;
  bytes candidate_hash = 3;
  google.protobuf.Timestamp expires_at = 4;
  nonproxy.common.v1.ErrorDetail error = 5;
  uint32 rule_count = 6;
  bool client_validated = 7;
  bytes configuration_candidate_hash = 8;
  string managed_rules_reference = 9;
  string direct_target = 10;
}

// ApplyChangeRequest 请求原子应用已经准备的变更。
message ApplyChangeRequest {
  // operation_id 是 v1 预留字段；新客户端必须使用 context.operation_id。
  string operation_id = 1;
  string change_id = 2;
  bytes expected_candidate_hash = 3;
  AdapterRequestContext context = 4;
  bytes expected_configuration_candidate_hash = 5;
}

// ApplyChangeResponse 返回应用和重载结果。
message ApplyChangeResponse {
  bool applied = 1;
  bool reloaded = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
  // replayed 表示候选在本次调用前已经应用；重载失败时不会自动撤销既有候选。
  bool replayed = 4;
  // rolled_back 表示候选重载失败后，两个文件已经自动恢复。
  bool rolled_back = 5;
  // rollback_reloaded 表示恢复后的旧配置也已重新载入客户端。
  bool rollback_reloaded = 6;
}

// VerifyChangeRequest 请求真实路径验证。
message VerifyChangeRequest {
  // operation_id 是 v1 预留字段；新客户端必须使用 context.operation_id。
  string operation_id = 1;
  string change_id = 2;
  AdapterRequestContext context = 3;
}

// VerifyChangeResponse 返回证据等级而不是配置成功猜测。
message VerifyChangeResponse {
  bool verified = 1;
  nonproxy.common.v1.EvidenceLevel evidence_level = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
  bool configuration_verified = 4;
  bool path_verified = 5;
}

// RollbackChangeRequest 请求恢复指定备份。
message RollbackChangeRequest {
  // operation_id 是 v1 预留字段；新客户端必须使用 context.operation_id。
  string operation_id = 1;
  string change_id = 2;
  string backup_id = 3;
  AdapterRequestContext context = 4;
}

// RollbackChangeResponse 返回恢复和重载结果。
message RollbackChangeResponse {
  bool restored = 1;
  bool reloaded = 2;
  nonproxy.common.v1.ErrorDetail error = 3;
  bool replayed = 4;
}
