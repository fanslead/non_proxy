[workspace]
resolver = "3"
members = [
  "crates/*",
  "services/*",
  "tools/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
idna = "1.1.0"
getrandom = "0.4.3"
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
keyring = "4.1.5"
prost = "0.14.4"
prost-types = "0.14.4"
proptest = "1.11.0"
psl = "2.1.223"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net", "sync"] }
tokio-socks = "0.5.3"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
