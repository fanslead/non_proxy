[workspace]
resolver = "3"
members = [
  "crates/*",
  "tools/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
idna = "1.1.0"
proptest = "1.11.0"
psl = "2.1.223"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
