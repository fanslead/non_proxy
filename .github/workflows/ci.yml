name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nonproxy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tooling:
    name: Windows 发布工具语法
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定为 v6.0.2

      - name: 解析 PowerShell 文件
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Include *.ps1,*.psm1 -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors)
              foreach ($error in $errors) {
                Write-Error "$($_.FullName): $($error.Message)" -ErrorAction Continue
                $failed = $true
              }
            }
          if ($failed) {
            throw "Windows PowerShell 工具存在语法错误。"
          }

      - name: 检查 Primitive Driver INF 发行约束
        shell: pwsh
        run: |
          $inf = Get-Content platform/windows/driver/NonProxyWfp.inx -Raw
          @(
            "[DefaultInstall.NTamd64]",
            "[DefaultInstall.NTarm64]",
            "DefaultDestDir = 13",
            "ServiceBinary = %13%\NonProxyWfp.sys",
            "Dependencies = BFE",
            "PnpLockdown = 1"
          ) | ForEach-Object {
            if (-not $inf.Contains($_)) {
              throw "INF 缺少发行约束：$_"
            }
          }

      - name: 检查 Adapter Host 发行与登录任务约束
        shell: pwsh
        run: |
          $files = @{
            build = Get-Content scripts/windows/build-release-package.ps1 -Raw
            sign = Get-Content scripts/windows/sign-release-package.ps1 -Raw
            verify = Get-Content scripts/windows/verify-release-package.ps1 -Raw
            install = Get-Content scripts/windows/install-system-components.ps1 -Raw
            task = Get-Content scripts/windows/NonProxy.Windows.AdapterHost.psm1 -Raw
            service = Get-Content scripts/windows/NonProxy.Windows.Service.psm1 -Raw
          }
          @(
            @{ file = "build"; text = "AdapterHostExecutable" },
            @{ file = "build"; text = "nonproxy-adapter-host.exe" },
            @{ file = "build"; text = "BootstrapPublishDirectory" },
            @{ file = "build"; text = "ExpectedPublisherCertificateSha256" },
            @{ file = "sign"; text = "adapter/nonproxy-adapter-host.exe" },
            @{ file = "sign"; text = "bootstrap/NonProxy.Windows.Bootstrap.exe" },
            @{ file = "verify"; text = "adapter/nonproxy-adapter-host.exe" },
            @{ file = "verify"; text = "bootstrap/NonProxy.Windows.Bootstrap.exe" },
            @{ file = "verify"; text = "ConsumerBootstrapManifestSha256" },
            @{ file = "install"; text = "Set-NonProxyAdapterHostTask" },
            @{ file = "install"; text = "Remove-NonProxyAdapterHostTask" },
            @{ file = "install"; text = "Stop-NonProxyAdapterHostProcesses" },
            @{ file = "service"; text = "S-1-5-32-545" },
            @{ file = "task"; text = "New-ScheduledTaskTrigger -AtLogOn" },
            @{ file = "task"; text = "-RunLevel Limited" },
            @{ file = "task"; text = "-MultipleInstances Parallel" }
          ) | ForEach-Object {
            if (-not $files[$_.file].Contains($_.text)) {
              throw "Adapter Host 发行约束缺失：$($_.file) / $($_.text)"
            }
          }

  verify:
    name: 验证单体仓库
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: 检出代码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定为 v6.0.2

      - name: 安装仓库工具链
        run: ./scripts/bootstrap/install-local-tools.sh

      - name: 验证固定 Xcode 工具链
        run: xcrun --find install_name_tool

      - name: 执行完整检查
        run: |
          source scripts/bootstrap/env.sh
          just check

  windows-driver:
    name: Windows WFP Driver（${{ matrix.platform }}）
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x64
          - ARM64
    steps:
      - name: 检出代码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定为 v6.0.2

      - name: 使用 WDK 构建最小 Callout Driver
        shell: pwsh
        run: ./scripts/windows/build-driver.ps1 -Platform '${{ matrix.platform }}'

      - name: 上传未签名构建证据
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定为 v4.6.2
        with:
          name: nonproxy-wfp-${{ matrix.platform }}-unsigned
          path: .artifacts/windows-driver/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  windows-rust-services:
    name: Windows Rust 服务（${{ matrix.architecture }}）
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            lint: true
          - architecture: ARM64
            target: aarch64-pc-windows-msvc
            lint: false
    steps:
      - name: 检出代码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定为 v6.0.2

      - name: 安装固定 Rust 目标
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup target add '${{ matrix.target }}' --toolchain 1.97.1

      - name: 安装固定 Protobuf Compiler
        shell: pwsh
        run: ./scripts/bootstrap/install-protoc-windows.ps1

      - name: 编译并检查 Windows Rust 服务
        shell: pwsh
        run: |
          if ('${{ matrix.lint }}' -eq 'true') {
            cargo +1.97.1 clippy --locked `
              -p nonproxy-adapter-host `
              -p nonproxy-gatewayd `
              --all-targets `
              --target '${{ matrix.target }}' `
              -- -D warnings
          } else {
            cargo +1.97.1 check --locked `
              -p nonproxy-adapter-host `
              -p nonproxy-gatewayd `
              --all-targets `
              --target '${{ matrix.target }}'
          }

      - name: 验证 Windows ACL 与文件事务
        if: matrix.lint
        shell: pwsh
        run: |
          cargo +1.97.1 test --locked `
            -p nonproxy-windows-security `
            -p nonproxy-local-auth `
            -p nonproxy-adapter-transaction `
            --target '${{ matrix.target }}'
